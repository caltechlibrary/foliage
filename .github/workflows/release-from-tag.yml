name: Release from Tag

on:
  push:
    tags:
      - v*

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Extract and validate tag vs setup.cfg
        id: extract
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_IN_TAG="${TAG#v}"
          VERSION_IN_CFG="$(awk -F '=' '/^version[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' setup.cfg)"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_IN_TAG" >> "$GITHUB_OUTPUT"

          if [ "$VERSION_IN_TAG" != "$VERSION_IN_CFG" ]; then
            echo "Tag version ($VERSION_IN_TAG) does not match setup.cfg version ($VERSION_IN_CFG)."
            exit 1
          fi

  build-macos:
    needs: validate-version
    permissions:
      contents: read
    uses: ./.github/workflows/macos-build.yml
    secrets: inherit

  build-windows:
    needs: validate-version
    permissions:
      contents: read
    uses: ./.github/workflows/windows-build.yml

  # The release is created only after both installers build, so a published
  # release always has its DMG and MSI attached.
  create-release:
    needs: [validate-version, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers/
          merge-multiple: true

      - name: List installers
        run: ls -l installers/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: Release ${{ needs.validate-version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/foliage_*_macos_*.dmg
            installers/foliage_*_windows_*.msi
